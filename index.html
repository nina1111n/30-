   <!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ჯაბა 💀❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #16000b, #57001f, #12000a);
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
}

.box {
    width: 85%;
    max-width: 400px;
    padding: 35px 25px;
    border-radius: 30px;
    background: rgba(255,255,255,0.12);
    box-shadow: 0 15px 50px rgba(0,0,0,0.5);
}

h1 {
    font-size: 30px;
    margin-bottom: 15px;
}

p {
    font-size: 22px;
}

button {
    display: block;
    width: 100%;
    margin: 15px 0;
    padding: 18px;
    border: none;
    border-radius: 18px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.love {
    background: #ff4f91;
    color: white;
}

.dead {
    background: #222;
    color: white;
}

#answer {
    display: none;
    margin-top: 25px;
    font-size: 27px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="box">

    <div style="font-size:50px;">💀❤️</div>

    <h1>ჯაბა დაგაჯდა სიკვდილის ბუზი 😈</h1>

    <p>აირჩიე:</p>

    <button class="love" onclick="love()">
        1. გიყვარვარ 😍
    </button>

    <button class="dead" onclick="dead()">
        2. გკიდივარ 💀🪦
    </button>

    <div id="answer"></div>

</div>

<script>

function love() {
    document.getElementById("answer").style.display = "block";
    document.getElementById("answer").innerHTML =
        "არ გეყვარებოდი და 🔫😂❤️";
}

function dead() {
    document.getElementById("answer").style.display = "block";
    document.getElementById("answer").innerHTML =
        "ნათელი გქონოდეს 🥴🪦😂";
}

</script>

</body>
</html>
